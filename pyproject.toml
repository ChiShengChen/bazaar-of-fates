[project]
name = "bazaar-of-fates"
version = "0.3.0"
description = "算命 — 13 traditional divination systems (西洋占星 · 八字 · 紫微 · 梅花 · 六爻 · 小六壬 · 四柱推命 · 七政四餘 · 鐵板 · 奇門 · 六壬 · 太乙 · Jyotiṣa) as deterministic Python engines + readings, from one birth moment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["astrology", "bazi", "ziwei", "divination", "fortune-telling", "jyotish", "i-ching", "qimen", "liuren", "mcp"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Games/Entertainment"]
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24.1",
    "ephem>=4.1",          # 占星 / 七政 / Jyotiṣa — real ecliptic longitudes
    "lunar_python>=1.4",   # 農曆 (pure Python, MIT; lunardate has 3 wrong months: 1933/1954/1978)
    "lunardate>=0.2",      # solar↔lunar fallback
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.39"]   # 解讀 backend; the service runs fully without it (mock)
# Optional sibling engines (all MIT) — richer 紫微 (x-iztro: 100+ stars, brightness, patterns),
# 黃曆 almanac (lunar-python), and reference implementations we cross-check against in tests.
# The service runs without them; see docs/CREDITS.md.
oracles = ["sxtwl>=2.0", "opencc-python-reimplemented>=0.1.7", "x-iztro>=0.6", "kinliuren>=0.1.2", "kinqimen>=0.0.6"]   # sxtwl is C++: wheels for CPython ≤3.12 only
mcp = ["mcp>=1.2"]          # `bazaar-mcp` — the Model Context Protocol server for Claude / Cursor / any MCP client
dev = ["pytest>=8.0", "httpx>=0.27", "pyswisseph>=2.10"]   # pyswisseph is AGPL: test oracle only, never a runtime dep

[project.urls]
Homepage = "https://github.com/ChiShengChen/bazaar-of-fates"
Documentation = "https://github.com/ChiShengChen/bazaar-of-fates/tree/main/docs"

[project.scripts]
bazaar = "fortune.cli:main"
bazaar-of-fates = "fortune.cli:main"
bazaar-mcp = "fortune.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fortune", "fortune.api", "fortune.casting", "fortune.engines", "fortune.engines.astrology", "fortune.engines.bazi",
            "fortune.engines.iching", "fortune.engines.jyotish", "fortune.engines.liuren", "fortune.engines.qimen",
            "fortune.engines.qizheng", "fortune.engines.suimei", "fortune.engines.taiyi", "fortune.engines.tieban",
            "fortune.engines.ziwei", "fortune.shared"]

[tool.setuptools.package-dir]
fortune = "fortune"

[tool.setuptools.package-data]
fortune = ["prompts/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
